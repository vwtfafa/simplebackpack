# SimpleBackpack translations (English)
# Values support MiniMessage (<aqua>, <bold>, ...) and legacy § color codes.
# Placeholders like {player} are replaced by the plugin.
open-success: "<aqua>Your backpack is now open!"
no-permission: "<red>You do not have permission to use this command."
players-only: "<red>This command can only be used by players."
not-allowed-world: "<red>You cannot use your backpack in this world."
first-join: "<yellow>Welcome! Use /backpack to open your personal backpack. You can share it with your team and configure it via /backpackconfig."
creative-not-allowed: "<red>Backpack is not available in Creative mode."
reload-success: "<green>Config reloaded successfully."
team-invite: "<green>You have invited {player} to your team."
team-full: "<red>Your team is full."
team-leave: "<green>You have left the team."
not-in-team: "<red>You are not in a team."
backpacks-disabled: "<red>Backpacks are currently disabled by an admin."
admin-enabled: "<green>Backpacks globally enabled."
admin-disabled: "<red>Backpacks globally disabled."
admin-cleared: "<green>{player}'s backpack has been cleared."
admin-gui-disabled: "<red>The admin GUI is disabled in the configuration."
admin-hint: "<gray>Use /backpackadmin gui, /backpackadmin clear <player>, /backpackadmin enable or /backpackadmin disable."
admin-edit-conflict: "<red>{player} currently has this backpack open - your changes were discarded."
team-members: "<aqua>Team members: {members}"
share-usage: "<red>Usage: /backpackshare <player> [durationMinutes]"
share-success: "<green>Shared backpack with {player}."
share-received: "<green>You have been granted temporary access to {player}'s backpack."
invite-usage: "<red>Usage: /invite <player>"
invite-self: "<red>You cannot invite yourself."
target-in-team: "<red>The target player is already in a team."
team-invite-recv: "<green>{player} has invited you to their team! Type /team accept to join."
team-joined: "<green>You have joined {player}'s team!"
team-pending: "<green>You have a pending invite from {player}! Type /team accept to join."
team-invite-expired: "<red>Your team invite has expired."
preview-mode: "<red>Preview mode - changes are not allowed."
config-changed-name: "<green>Backpack name changed."
config-changed-color: "<green>Backpack color changed."
config-changed-size: "<green>Backpack size changed."
resize-no-space: "<red>Not enough space in your inventory to shrink the backpack."
# GUI labels (always shown, regardless of messages-enabled)
gui-config-title: "<aqua>Backpack Config"
gui-default-backpack-name: "<aqua>Backpack"
gui-admin-list-title: "<aqua>SimpleBackpack Admin"
gui-admin-view-title: "<aqua>Backpack: {player}"
gui-prev-page: "<yellow>< Previous page"
gui-next-page: "<yellow>Next page >"
gui-entry-size: "<gray>Size: {size}"
gui-entry-instructions: "<gray>Left-click: Edit, Right-click: Preview"
gui-admin-info: "<gray>Backpacks: {total} (page {page}/{max})"
