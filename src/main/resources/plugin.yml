name: SimpleBackpack
main: org.vwtfafa.backpack.Backpack
version: '${version}'
api-version: 26.2
permissions:
  simplebackpack.use:
    description: Allows using /backpack and /bp
    default: true
  simplebackpack.config:
    description: Allows using /backpackconfig
    default: op
  simplebackpack.reload:
    description: Allows using /backpackreload
    default: op
  simplebackpack.team:
    description: Allows using /team
    default: true
  simplebackpack.team.invite:
    description: Allows inviting players to your team
    default: true
  simplebackpack.team.leave:
    description: Allows leaving your team
    default: true
  simplebackpack.admin:
    description: Allows using admin commands
    default: op
authors: ["vwtfafa"]

description: >
  SimpleBackpack — persistent, configurable player backpacks with a clean vanilla-style GUI.

  Features:
    - Personal Backpacks: per-player persistent backpacks with configurable size, name and color.
    - Team Backpacks: create/invite/share backpacks with simple team commands.
    - Classic Mode: minimal mode with only /backpack and /bp.
    - Admin Tools: admin GUI, admin insert, live reload and audit logging.
    - Live Config GUI: change size, color and other options in-game with instant apply.
    - Multi-language: English and German included; messages fully editable.
    - Improved Storage: persistent YAML storage (compatible with previous versions) with async saves.

  Commands:
    - /backpack, /bp — Open personal backpack
    - /backpackconfig — Open configuration GUI
    - /backpackreload — Reload plugin configuration
    - /invite <player> — Invite player to your team
    - /team — Show your team members
    - /leave — Leave your team
    - /backpackadmin gui — Open admin overview GUI
    - /backpackshare <player> [minutes] — Temporarily share your backpack

  Permissions (defaults shown):
    - simplebackpack.use (true)
    - simplebackpack.config (op)
    - simplebackpack.reload (op)
    - simplebackpack.team (true)
    - simplebackpack.team.invite (true)
    - simplebackpack.team.leave (true)
    - simplebackpack.admin (op)
  Author: vwtfafa
