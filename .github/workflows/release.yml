name: Build and Release

on:
  push:
    branches:
      - master
      - main
      - beta
      - paper-26.3

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read release configuration
        id: config
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          CONFIG=".github/release-config.yml"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: $CONFIG not found"
            exit 1
          fi

          CONFIG_LINE=$(awk -v branch="$BRANCH" '
            $0 ~ "^  " branch ":$" {
              found=1
              next
            }
            found && /^  [a-zA-Z0-9._-]+:$/ {
              exit
            }
            found && /type:/ {
              type=$2
            }
            found && /paper:/ {
              paper=$2
              gsub(/"/, "", paper)
            }
            found && /java:/ {
              java=$2
              gsub(/"/, "", java)
            }
            END {
              if (found && type != "" && paper != "" && java != "")
                print type "|" paper "|" java
            }
          ' "$CONFIG")

          if [ -z "$CONFIG_LINE" ]; then
            echo "ERROR: No valid configuration found for branch '$BRANCH'"
            exit 1
          fi

          IFS='|' read -r TYPE PAPER JAVA <<< "$CONFIG_LINE"

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "paper=$PAPER" >> "$GITHUB_OUTPUT"
          echo "java=$JAVA" >> "$GITHUB_OUTPUT"

          echo "Branch: $BRANCH"
          echo "Release type: $TYPE"
          echo "Paper: $PAPER"
          echo "Java: $JAVA"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "${{ steps.config.outputs.java }}"
          distribution: temurin
          cache: gradle

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "^version" build.gradle | head -1 | sed "s/^version = ['\"]//;s/['\"].*$//" | tr -d ' ')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not extract version from build.gradle"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Verify JAR
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARTIFACT="build/libs/SimpleBackpack-${VERSION}.jar"

          if [ ! -f "$ARTIFACT" ]; then
            echo "ERROR: Expected plugin JAR not found:"
            echo "$ARTIFACT"
            echo
            echo "Available files:"
            ls -la build/libs/
            exit 1
          fi

          echo "Found: $ARTIFACT"

      - name: Prepare release body
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PAPER: ${{ steps.config.outputs.paper }}
          JAVA: ${{ steps.config.outputs.java }}
          TYPE: ${{ steps.config.outputs.type }}
          BRANCH: ${{ github.ref_name }}
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" "${LAST_TAG}..HEAD")

            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- No changes since last release"
            fi
          else
            CHANGELOG="- Initial release"
          fi

          case "$TYPE" in
            stable)
              TITLE="${VERSION}"
              WARNING=""
              ;;
            beta)
              TITLE="v${VERSION}-beta"
              WARNING="⚠️ **This is a BETA / DEVELOPMENT release.** Use it for testing and report any bugs you find."
              ;;
            test)
              TITLE="${VERSION}-${BRANCH}"
              WARNING="⚠️ **This is a TEST release.** It is intended for compatibility testing."
              ;;
            *)
              echo "ERROR: Unknown release type '$TYPE'"
              exit 1
              ;;
          esac

          awk -v VERSION="$VERSION" \
            -v TITLE="$TITLE" \
            -v WARNING="$WARNING" \
            -v PAPER="$PAPER" \
            -v JAVA="$JAVA" \
            -v BRANCH="$BRANCH" \
            -v CHANGELOG="$CHANGELOG" \
            -v GITHUB_SHA="$GITHUB_SHA" \
            -v BUILD_DATE="$BUILD_DATE" \
            '{
              gsub(/@VERSION@/, VERSION);
              gsub(/@TITLE@/, TITLE);
              gsub(/@WARNING@/, WARNING);
              gsub(/@PAPER@/, PAPER);
              gsub(/@JAVA@/, JAVA);
              gsub(/@BRANCH@/, BRANCH);
              gsub(/@CHANGELOG@/, CHANGELOG);
              gsub(/@GITHUB_SHA@/, GITHUB_SHA);
              gsub(/@BUILD_DATE@/, BUILD_DATE);
              print
            }' .github/RELEASE_TEMPLATE.md > release-body.md

          echo "Release body:"
          cat release-body.md

      - name: Determine release tag
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TYPE: ${{ steps.config.outputs.type }}
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$TYPE" in
            stable)
              TAG="v${VERSION}"
              ;;
            beta)
              TAG="v${VERSION}-beta"
              ;;
            test)
              TAG="v${VERSION}-${BRANCH}"
              ;;
            *)
              echo "ERROR: Unknown release type '$TYPE'"
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TYPE: ${{ steps.config.outputs.type }}
        run: |
          ARTIFACT="build/libs/SimpleBackpack-${VERSION}.jar"

          if [ "$TYPE" = "stable" ]; then
            PRERELEASE=false
            LATEST=true
          else
            PRERELEASE=true
            LATEST=false
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release: $TAG"

            gh release upload \
              "$TAG" \
              "$ARTIFACT" \
              --clobber

            gh release edit \
              "$TAG" \
              --notes-file release-body.md \
              --prerelease="$PRERELEASE" \
              --latest="$LATEST"
          else
            echo "Creating release: $TAG"

            gh release create \
              "$TAG" \
              "$ARTIFACT" \
              --title "SimpleBackpack ${TAG}" \
              --notes-file release-body.md \
              --prerelease="$PRERELEASE" \
              --latest="$LATEST"
          fi

      - name: Delete beta tags after stable release
        if: steps.config.outputs.type == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin --tags --force

          BETA_TAGS=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-beta(\.[0-9]+)?$' || true)

          if [ -z "$BETA_TAGS" ]; then
            echo "No beta tags found"
            exit 0
          fi

          echo "$BETA_TAGS" | while read -r TAG; do
            echo "Deleting beta tag: $TAG"
            git push origin --delete "$TAG" || true
          done

          echo "All beta tags have been deleted"