import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.Confidence

plugins {
    id 'java'

    id("xyz.jpenilla.run-paper") version "3.1.0"
    id "com.gradleup.shadow" version "9.6.1"
    id "checkstyle"
    id "com.github.spotbugs" version "6.5.9"
}

group = 'org.vwtfafa'
version = '5.0'

repositories {
    mavenCentral()

    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.112-stable")

    implementation 'org.json:json:20260814'
    implementation("org.bstats:bstats-bukkit:3.2.1")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
    testImplementation 'org.mockito:mockito-core:5.0.0'
    testImplementation 'org.mockito:mockito-inline:5.0.0'
    testImplementation 'io.papermc.paper:paper-api:26.2.build.112-stable'
}

tasks {
    test {
        useJUnitPlatform()
    }

    runServer {
        minecraftVersion("26.2")
    }

    jar {
        archiveBaseName.set("SimpleBackpack")
        archiveVersion.set(project.version.toString())
        archiveClassifier.set("")
    }

    shadowJar {
        archiveBaseName.set("SimpleBackpack")
        archiveVersion.set(project.version.toString())
        archiveClassifier.set("")

        configurations = [project.configurations.runtimeClasspath]

        dependencies {
            exclude { it.moduleGroup != "org.bstats" }
        }

        relocate("org.bstats", "${project.group}.bstats")
    }
}

def targetJavaVersion = 25

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)

    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion

    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]

    inputs.properties props
    filteringCharset = 'UTF-8'

    filesMatching('plugin.yml') {
        expand props
    }
}

checkstyle {
    toolVersion = "10.12.4"
    configFile = file("config/checkstyle/checkstyle.xml")
}

spotbugs {
    toolVersion = "4.10.3"
    ignoreFailures = false

    effort = Effort.MAX
    reportLevel = "LOW"

    reportsDir = file("build/reports/spotbugs")
    includeFilter = file("config/spotbugs/spotbugs.xml")
}