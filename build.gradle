plugins {
    id 'java'
    // Updated to the latest run-paper version compatible with Paper 26.2
    id("xyz.jpenilla.run-paper") version "3.0.2"
    // Add common quality plugins
    id "com.gradleup.shadow" version "9.6.1"
    id "checkstyle"
    id "com.github.spotbugs" version "6.5.9"
}

group = 'org.vwtfafa'
version = '5.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    // Retain any additional repositories from the original project if needed
    // (none required beyond Paper repository for SimpleBackpack)
}

dependencies {
    // Keep the exact Paper API version used by the project
    compileOnly("io.papermc.paper:paper-api:26.2.build.112-stable")
    implementation 'org.json:json:20231013'
    implementation("org.bstats:bstats-bukkit:3.1.0")
    // No new dependencies introduced – existing ones are preserved
}

tasks {
    runServer {
        // Use the Paper version that matches the target API
        minecraftVersion("26.2")
    }

    // Assemble a proper plugin jar (no classifier, simple name)
    jar {
        archiveBaseName.set("SimpleBackpack")
        archiveVersion.set(project.version.toString())
        archiveClassifier.set("")
    }

    // Build a shaded jar that includes only the bStats library and relocates it
    shadowJar {
        archiveBaseName.set("SimpleBackpack")
        archiveVersion.set(project.version.toString())
        archiveClassifier.set("")
        configurations = [project.configurations.runtimeClasspath]

        dependencies {
            // Only merge bStats into the final jar; exclude everything else
            exclude { it.moduleGroup != "org.bstats" }
        }

        // Relocate the bStats package to avoid conflicts with other plugins
        relocate("org.bstats", "${project.group}.bstats")
    }
}

// Java toolchain configuration – keep target Java version 25
def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// Checkstyle configuration – assumes config/checkstyle/checkstyle.xml exists
checkstyle {
    toolVersion = "10.12.4"
    configFile = file("config/checkstyle/checkstyle.xml")
}

// SpotBugs configuration – assumes config/spotbugs/spotbugs.xml exists
spotbugs {
    toolVersion = "4.10.3"
    ignoreFailures = false
    effort = com.github.spotbugs.snom.Effort.MAX
    reportLevel = com.github.spotbugs.snom.ReportLevel.LOW
    reportsDir = file("build/reports/spotbugs")
    includeFilter = file("config/spotbugs/spotbugs.xml")
}
